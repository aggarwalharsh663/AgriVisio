<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agri Scan Simulated Chamber Test</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #1d3930;
        background: #f4f7f5;
        font-family: sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #c5c9c3;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #74837b;
        border-radius: 4px;
        background: white;
        color: #1d3930;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="chamber-canvas" width="900" height="560"
        aria-label="Simulated rice imaging chamber"></canvas>
      <div class="controls" aria-label="Simulated chamber controls">
        <button type="button" data-light="ring_light">Ring light</button>
        <button type="button" data-light="daylight">Daylight</button>
        <button type="button" data-light="tube_light">Tube light</button>
        <button type="button" id="pour-button">Pour simulated rice</button>
        <button type="button" id="flash-button">Simulated camera flash</button>
      </div>
    </main>
    <script src="chamber.js"></script>
    <script>
      document.querySelectorAll("[data-light]").forEach(function (button) {
        button.addEventListener("click", function () {
          window.Chamber.setLighting(button.dataset.light);
        });
      });
      document.getElementById("pour-button").addEventListener("click", function () {
        window.Chamber.pourRice(function () {
          console.log("Simulated rice pour complete");
        });
      });
      document.getElementById("flash-button").addEventListener("click", function () {
        window.Chamber.cameraFlash(function () {
          console.log("Simulated camera flash complete");
        });
      });
    </script>
  </body>
</html>
